<title>The VC Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-screen night arena canvas, seen from above. Floating header + search, legend, filter chips, ticket-stub card. Deliberate single dark look. */
:root{
  --night:#0b0d14; --panel:rgba(16,18,28,.88); --line:rgba(255,255,255,.10);
  --fg:#f1ede4; --muted:#9a97a6; --gold:#f2c94c; --fire:#ff5a2a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:none}
#arena{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;background:radial-gradient(ellipse at 50% 50%,#1a1d2c 0%,var(--night) 70%)}
#arena.drag{cursor:grabbing}
.top{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;background:linear-gradient(to bottom,rgba(11,13,20,.9),rgba(11,13,20,0));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.top>*{pointer-events:auto}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:.9;margin:0;letter-spacing:.02em;text-transform:uppercase}
.brand h1 span{color:var(--gold)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.sample.live.on{border-color:#2fbf71;color:#2fbf71}
.sample{display:inline-block;margin-left:6px;padding:1px 7px;border:1px solid var(--fire);color:var(--fire);border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;vertical-align:2px}
.search{position:relative;width:min(300px,100%)}
.search input{width:100%;box-sizing:border-box;font:500 15px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 34px}
.search input:focus{outline:2px solid var(--gold);outline-offset:1px}
.search svg{position:absolute;left:11px;top:12px;width:15px;height:15px;stroke:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#161925;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.results button{display:flex;justify-content:space-between;width:100%;text-align:left;font:500 14px var(--body);color:var(--fg);background:none;border:0;padding:8px 12px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:rgba(255,255,255,.06);outline:none}
.results small{color:var(--muted);font-size:12px}
.chips{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips button{pointer-events:auto;font:600 13px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.chips button.on{background:var(--gold);color:#1b1608;border-color:var(--gold)}
.chips button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.match{width:100%;text-align:center;color:var(--muted);font-size:12px}
.legend{max-height:calc(100% - 220px);overflow:auto;position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:calc(112px + env(safe-area-inset-top,0px));display:grid;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;min-width:200px}
.legend h3{margin:0 0 2px;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.legend div,.legend .lrow{display:flex;align-items:center;gap:8px}
.legend .lrow{width:100%;background:none;border:0;color:var(--fg);font:inherit;text-align:left;padding:2px 4px;margin:0 -4px;border-radius:5px;cursor:pointer}
.legend .lrow:hover,.legend .lrow:focus-visible{background:rgba(255,255,255,.08);outline:none}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.legend span{color:var(--muted);margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums}
.legend hr{border:0;border-top:1px solid var(--line);margin:3px 0;width:100%}
.zoom{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.zoom button{width:38px;height:38px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font:600 18px var(--body);cursor:pointer}
.zoom button:focus-visible{outline:2px solid var(--gold)}
/* ticket stub */
.ticket{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 32px));
  display:grid;grid-template-columns:1fr 78px;background:#f4efe2;color:#1d1a14;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden}
.ticket .main{padding:12px 14px 12px 16px;border-right:2px dashed #c9bfa8;min-width:0}
.ticket .stub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--tc,#ce1141);color:#fff;padding:8px 4px;text-align:center}
.ticket .stub b{font:800 42px var(--display);line-height:1}
.ticket .stub small{font:600 9px var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.ticket .ev{font:700 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#8a7f69}
.ticket h2{font:800 22px var(--display);margin:2px 0 6px;letter-spacing:.02em;overflow-wrap:anywhere}
.ticket .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.ticket .grid div{background:#e8e0cc;border-radius:4px;padding:3px 6px}
.ticket .grid small{display:block;font:600 8px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#7a705c}
.ticket .grid b{font:700 16px var(--mono)}
.ticket p{margin:0;font-size:12px;line-height:1.45;color:#3b352a}
.ticket .burn{color:#c2350f;font-weight:700}
.ticket .x{position:absolute;right:84px;top:4px;background:none;border:0;color:#8a7f69;font-size:18px;cursor:pointer}
.sale{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:calc(112px + env(safe-area-inset-top,0px));width:min(290px,calc(100% - 32px));max-height:calc(100% - 260px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sale header{padding:10px 12px;border-bottom:1px solid var(--line)}
.sale header b{font:800 18px var(--display);letter-spacing:.03em;display:block}
.sale header small{color:var(--muted);font-size:12px}
.sale .tabs{display:flex;gap:6px;margin-top:8px}
.sale .tabs button{flex:1;font:600 12px var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:5px;cursor:pointer}
.sale .tabs button.on{color:#0b1a10;background:#3ee07f;border-color:#3ee07f}
.sale ul{list-style:none;margin:0;padding:0;overflow:auto}
.sale li button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:9px 12px;cursor:pointer;font:500 13px var(--body)}
.sale li button:hover,.sale li button:focus-visible{background:rgba(62,224,127,.08);outline:none}
.sale li em{font-style:normal;color:var(--muted);font-size:12px;grid-column:1}
.sale li.spon button{background:rgba(242,201,76,.08);border-left:3px solid var(--gold)}
.sale .tag{font-style:normal;font:700 9px var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#1b1608;border-radius:3px;padding:1px 4px;margin-right:4px;vertical-align:1px}
.sale li strong{color:#3ee07f;font:700 15px var(--mono);grid-row:1/3;grid-column:2;align-self:center}
.ticket .buy{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ticket .buy a,.ticket .buy button{font:700 12px var(--body);border-radius:5px;padding:6px 9px;cursor:pointer;text-decoration:none;border:0}
.ticket .buy a{background:#1d1a14;color:#f4efe2}
.ticket .buy a.prof{background:#5b3fb0;color:#fff}
.ticket .buy button{background:#e8e0cc;color:#1d1a14}
.ticket .price{font:700 15px var(--mono);color:#137a3f}
.sale.notable li strong{color:var(--gold)}
.sale.joined .tabs button.on{background:#8f6bf0;border-color:#8f6bf0;color:#fff}
.sale.joined li strong{color:#c2a8ff}
.sale.hodl .tabs button.on{background:var(--gold);border-color:var(--gold);color:#1b1608}
.sale.hodl li strong{color:var(--gold)}
.sale.burn li strong{color:#ff6b62}
.sale .tabs.sub button.on{background:#f1ede4;border-color:#f1ede4;color:#14161f}
.sale .stand{display:block;margin-top:8px;font:700 13px var(--body);color:var(--fg)}
.sale .note{padding:8px 12px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.ticket .play{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;margin:6px 0;padding:6px;background:#1d1a14;border-radius:6px;color:#f4efe2}
.ticket .play img{width:62px;height:62px;border-radius:4px;display:block}
.ticket .play b{display:block;font:700 11px var(--body);color:#f2c94c}
.ticket .play span{display:block;font-size:11.5px;line-height:1.3}
.ticket .play em{display:block;font-style:normal;font-size:10px;color:#a79f8c;margin-top:2px}
.ticket .star{margin:-4px 0 6px;font-weight:700;color:#8a5a00}
.ticket .hold{color:#6b5310;font-weight:600}
.ticket .who{margin-top:4px;padding-top:4px;border-top:1px dashed #c9bfa8;color:#5a5244}
.cert{position:fixed;inset:0;z-index:20;background:rgba(5,6,10,.82);display:grid;place-items:center;padding:16px}
.cert-in{max-width:min(900px,100%);display:grid;gap:10px}
.cert img{width:100%;height:auto;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.cert-btns{display:flex;gap:8px;justify-content:center}
.cert-btns a,.cert-btns button{font:700 14px var(--body);padding:9px 16px;border-radius:6px;border:0;cursor:pointer;text-decoration:none}
.cert-btns a{background:var(--gold);color:#1b1608}.cert-btns button{background:#2a2e3c;color:var(--fg)}
@media (max-width:700px){.legend{display:none}.brand p{display:none}.sale{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px));max-height:40%}}
</style>

function rrPath(W,H,R){
  // rounded rect perimeter, starting top-centre going clockwise
  const segs=[];const add=(len,fn)=>segs.push({len,fn});
  add(W-R,t=>[t*(W-R),-H]);
  add(Math.PI*R/2,t=>{const a=-Math.PI/2+t*Math.PI/2;return[W-R+R*Math.cos(a),-H+R+R*Math.sin(a)]});
  add(2*(H-R),t=>[W,-H+R+t*2*(H-R)]);
  add(Math.PI*R/2,t=>{const a=t*Math.PI/2;return[W-R+R*Math.cos(a),H-R+R*Math.sin(a)]});
  add(2*(W-R),t=>[W-R-t*2*(W-R),H]);
  add(Math.PI*R/2,t=>{const a=Math.PI/2+t*Math.PI/2;return[-W+R+R*Math.cos(a),H-R+R*Math.sin(a)]});
  add(2*(H-R),t=>[-W,H-R-t*2*(H-R)]);
  add(Math.PI*R/2,t=>{const a=Math.PI+t*Math.PI/2;return[-W+R+R*Math.cos(a),-H+R+R*Math.sin(a)]});
  add(W-R,t=>[-W+R+t*(W-R),-H]);
  const L=segs.reduce((a,s)=>a+s.len,0);
  return{L,at(u){let d=((u%1)+1)%1*L;for(const s of segs){if(d<=s.len)return s.fn(s.len?d/s.len:0);d-=s.len}return segs[0].fn(0)}};
}

const ROWS=["AA","A","B","C","D","E","F","G","H","J","K","L","M","N","P","Q","R","S","T","U","V","W","X","Y","Z"];
const rowName=k=>ROWS[k]||("Z"+(k-ROWS.length+2));
const SHORT={omega:"OMEGA",galac:"GALACTIC",cosmic:"COSMIC",asg:"ASG",dallas:"DALLAS",origin:"ORIGIN",tsd:"DEBUT",rib:"RIB",fandom:"FANDOM",archive:"ARCHIVE"};
const GOLDWHY=(m,S)=>m.serial===1?"First mint":m.serial===S.minted?"Last mint":m.serial===15?"Jersey #15":m.serial===25&&S.key==="dallas"?"Dallas jersey #25":"";
for(const S of SETS)for(const m of S.list){m.gold=!!GOLDWHY(m,S);m.sec=S.key;m.seat=m.serial}
const labels=[];
function buildBand(inner,keys,wantRows){
  const groups=keys.map(k=>SK[k]);const total=groups.reduce((a,S)=>a+S.list.length,0);
  const GAP=groups.length>1?0.012:0;
  groups.forEach(S=>S.share=S.list.length/total);
  const lap=k=>{const d=inner+k*ROWP;return rrPath(CW+d,CH+d,70+d)};
  const fits=R=>{for(let k=0;k<R;k++){const p=lap(k);for(const S of groups){const n=Math.ceil(S.list.length/R);if(n*PITCH*.82>(S.share-2*GAP)*p.L)return false}}return true};
  let R=wantRows||1;while(!fits(R))R++;
  // first set centred on the top sideline, the rest follow clockwise
  let u=-groups[0].share/2;
  for(const S of groups){
    const n=Math.ceil(S.list.length/R);S.rows=R;S.perRow=n;
    const ua=u+GAP,ub=u+S.share-GAP;
    for(let k=0;k<R;k++){
      const p=lap(k),row=S.list.slice(k*n,(k+1)*n);if(!row.length)break;
      const arcU=ub-ua,step=Math.min(arcU/row.length,PITCH*1.35/p.L),start=ua+(arcU-step*row.length)/2;
      row.forEach((m,i)=>{const[x,y]=p.at(start+(i+.5)*step);m.x=x;m.y=y;m.row=rowName(k);seats.push(m)});
    }
    const mid=lap(R/2-.5),spots=S.share>.6?[0,.25,.5,.75].filter(s=>{const t=((s-ua)%1+1)%1;return t>.03&&t<(ub-ua)-.03}):[(ua+ub)/2];
    for(const s of spots){const[lx,ly]=mid.at(s);labels.push({k:S.key,t:S.debut?"★ DEBUT CLUB":SHORT[S.key],x:lx,y:ly,debut:!!S.debut})}
    u+=S.share;
  }
  return inner+R*ROWP;
}
// courtside: one front row (AA) along each sideline, serials left to right
{
  const sides=[{y:-CH-24,keys:["omega","galac","cosmic"]},{y:CH+24,keys:["asg","dallas"]}];
  for(const sd of sides){
    const sets=sd.keys.map(k=>SK[k]);const n=sets.reduce((a,S)=>a+S.list.length,0)+(sets.length-1)*3;
    const sp=Math.min(PITCH*.95,(CW*1.9)/n);let x=-n*sp/2;
    for(const S of sets){S.rows=1;S.perRow=S.list.length;const x0=x;
      for(const m of S.list){m.x=x+sp/2;m.y=sd.y;m.row="AA";seats.push(m);x+=sp}
      labels.push({k:S.key,t:SHORT[S.key],x:(x0+x)/2,y:sd.y+(sd.y<0?-16:16),court:true});x+=3*sp}
  }
}
