<title>The VC Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-screen night arena canvas, seen from above. Floating header + search, legend, filter chips, ticket-stub card. Deliberate single dark look. */
:root{
  --night:#0b0d14; --panel:rgba(16,18,28,.88); --line:rgba(255,255,255,.10);
  --fg:#f1ede4; --muted:#9a97a6; --gold:#f2c94c; --fire:#ff5a2a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:none}
#arena{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;background:radial-gradient(ellipse at 50% 50%,#1a1d2c 0%,var(--night) 70%)}
#arena.drag{cursor:grabbing}
.top{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;background:linear-gradient(to bottom,rgba(11,13,20,.9),rgba(11,13,20,0));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.top>*{pointer-events:auto}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:.9;margin:0;letter-spacing:.02em;text-transform:uppercase}
.brand h1 span{color:var(--gold)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.sample.live.on{border-color:#2fbf71;color:#2fbf71}
.sample{display:inline-block;margin-left:6px;padding:1px 7px;border:1px solid var(--fire);color:var(--fire);border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;vertical-align:2px}
.search{position:relative;width:min(300px,100%)}
.search input{width:100%;box-sizing:border-box;font:500 15px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 34px}
.search input:focus{outline:2px solid var(--gold);outline-offset:1px}
.search svg{position:absolute;left:11px;top:12px;width:15px;height:15px;stroke:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#161925;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.results button{display:flex;justify-content:space-between;width:100%;text-align:left;font:500 14px var(--body);color:var(--fg);background:none;border:0;padding:8px 12px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:rgba(255,255,255,.06);outline:none}
.results small{color:var(--muted);font-size:12px}
.chips{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips button{pointer-events:auto;font:600 13px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.chips button.on{background:var(--gold);color:#1b1608;border-color:var(--gold)}
.chips button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.match{width:100%;text-align:center;color:var(--muted);font-size:12px}
.legend{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:calc(112px + env(safe-area-inset-top,0px));display:grid;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;min-width:200px}
.legend h3{margin:0 0 2px;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.legend span{color:var(--muted);margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums}
.legend hr{border:0;border-top:1px solid var(--line);margin:3px 0;width:100%}
.zoom{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.zoom button{width:38px;height:38px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font:600 18px var(--body);cursor:pointer}
.zoom button:focus-visible{outline:2px solid var(--gold)}
/* ticket stub */
.ticket{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 32px));
  display:grid;grid-template-columns:1fr 78px;background:#f4efe2;color:#1d1a14;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden}
.ticket .main{padding:12px 14px 12px 16px;border-right:2px dashed #c9bfa8;min-width:0}
.ticket .stub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--tc,#ce1141);color:#fff;padding:8px 4px;text-align:center}
.ticket .stub b{font:800 30px var(--display);line-height:1}
.ticket .stub small{font:600 9px var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.ticket .ev{font:700 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#8a7f69}
.ticket h2{font:800 22px var(--display);margin:2px 0 6px;letter-spacing:.02em;overflow-wrap:anywhere}
.ticket .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.ticket .grid div{background:#e8e0cc;border-radius:4px;padding:3px 6px}
.ticket .grid small{display:block;font:600 8px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#7a705c}
.ticket .grid b{font:700 16px var(--mono)}
.ticket p{margin:0;font-size:12px;line-height:1.45;color:#3b352a}
.ticket .burn{color:#c2350f;font-weight:700}
.ticket .x{position:absolute;right:84px;top:4px;background:none;border:0;color:#8a7f69;font-size:18px;cursor:pointer}
.sale{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:calc(112px + env(safe-area-inset-top,0px));width:min(290px,calc(100% - 32px));max-height:calc(100% - 260px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sale header{padding:10px 12px;border-bottom:1px solid var(--line)}
.sale header b{font:800 18px var(--display);letter-spacing:.03em;display:block}
.sale header small{color:var(--muted);font-size:12px}
.sale .tabs{display:flex;gap:6px;margin-top:8px}
.sale .tabs button{flex:1;font:600 12px var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:5px;cursor:pointer}
.sale .tabs button.on{color:#0b1a10;background:#3ee07f;border-color:#3ee07f}
.sale ul{list-style:none;margin:0;padding:0;overflow:auto}
.sale li button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:9px 12px;cursor:pointer;font:500 13px var(--body)}
.sale li button:hover,.sale li button:focus-visible{background:rgba(62,224,127,.08);outline:none}
.sale li em{font-style:normal;color:var(--muted);font-size:12px;grid-column:1}
.sale li strong{color:#3ee07f;font:700 15px var(--mono);grid-row:1/3;grid-column:2;align-self:center}
.ticket .buy{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ticket .buy a,.ticket .buy button{font:700 12px var(--body);border-radius:5px;padding:6px 9px;cursor:pointer;text-decoration:none;border:0}
.ticket .buy a{background:#1d1a14;color:#f4efe2}
.ticket .buy button{background:#e8e0cc;color:#1d1a14}
.ticket .price{font:700 15px var(--mono);color:#137a3f}
@media (max-width:700px){.legend{display:none}.brand p{display:none}.sale{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px));max-height:40%}}
</style>

<canvas id="arena" aria-label="The VC Arena seen from above: one seat per Vince Carter moment"></canvas>

<header class="top">
  <div class="brand">
    <h1>The <span>VC</span> Arena</h1>
    <p>15,695 seats, one for every VC moment ever minted.<span class="sample">Sample owners</span><span class="sample live" id="live">Sample listings</span></p>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Find your seats… try “smith”" autocomplete="off">

  </div>
</header>

<aside class="legend" id="legend"></aside>
<aside class="sale" id="sale" hidden></aside>

  <button id="zin" aria-label="Zoom in">+</button>

<nav class="chips" id="chips">
  <button data-f="all" class="on">All seats</button>

  <button data-f="debut">Debut Club</button>
  <button data-f="burn">Retired (burned)</button>
  <button data-f="lock">Locked</button>
  <button data-f="j2021">Joined 2021</button>
  <button data-f="new26">2026 newcomers</button>
  <div class="match" id="match"></div>
</nav>

<script>
(()=>{
// ---------- sets (real supply numbers) ----------
const SETS=[
 {key:"omega",  name:"Dallas Omega",    tier:"court", minted:1,    burned:0,   color:"#ffffff"},
 {key:"galac",  name:"Dallas Galactic", tier:"court", minted:5,    burned:0,   color:"#bfe9ff"},
 {key:"cosmic", name:"TSD Cosmic",      tier:"court", minted:49,   burned:0,   color:"#f7d774"},
 {key:"asg",    name:"ASG Legendary",   tier:"court", minted:50,   burned:0,   color:"#f0b93a"},
 {key:"dallas", name:"Dallas Standard", tier:"court", minted:44,   burned:1,   color:"#d9a12c"},
 {key:"origin", name:"RIB Origin Rare", tier:"100",   minted:269,  burned:6,   color:"#c2a8ff"},
 {key:"tsd",    name:"TSD Common · Debut Club",tier:"100",minted:3336, burned:1, color:"#e8603c", debut:true},
 {key:"rib",    name:"RIB '05-06 Rare", tier:"200",   minted:990,  burned:38,  color:"#8f6bf0"},
 {key:"fandom", name:"Vintage Vibes Fandom",tier:"200",minted:951, burned:2,   color:"#2fc3b0"},
 {key:"archive",name:"Archive Set",     tier:"300",   minted:10000,burned:329, color:"#525d7c"},
];
const SK=Object.fromEntries(SETS.map(s=>[s.key,s]));
const TIERNAME={court:"Courtside","100":"100 Level","200":"200 Level","300":"300 Level"};
const BURN="#ff2a1f", PACK="#2a2e3c", SALE="#3ee07f";
const FLOOR={omega:0,galac:9000,cosmic:18000,asg:5050,dallas:289,origin:73,tsd:25,rib:24.9,fandom:18,archive:4.75};
const money=v=>"$"+(v>=1000?Math.round(v).toLocaleString():v.toFixed(2));

// ---------- sample owners (seeded) ----------
let seed=15;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const pick=a=>a[Math.floor(rnd()*a.length)];
const SUR=["smith","johnson","brown","taylor","wilson","martin","lee","clark","walker","young","king","wright","scott","green","baker","adams","nelson","hill","campbell","mitchell","roberts","phillips","evans","turner","torres","parker","collins","edwards","stewart","morris","murphy","cook","rogers","reed","bailey","bell","cooper","richardson","cox","ward","peterson","gray","ramirez","watson","brooks","kelly","sanders","price","bennett","wood","barnes","ross","henderson","coleman","jenkins","perry","powell","long","patel","nguyen","chen","singh","kim","dubois","tremblay","gagnon","roy","cote"];
const PRE=["","the","big","lil","mr","dr","its","real","just","old"];
const POST=["","15","_15","21","2021","_vc","vince","dunks","hoops","nj","raps","jr","88","99","_tsd","_bkn","_tor","collects"];
const used=new Set(["smith"]);
function mkName(){for(let t=0;t<30;t++){const s=pick(SUR);let n=pick(PRE)+(rnd()<.5?s:s[0].toUpperCase()+s.slice(1))+pick(POST);if(!used.has(n.toLowerCase())){used.add(n.toLowerCase());return n}}return "collector"+Math.floor(rnd()*1e6)}
const owners=[];
function newOwner(name){const r=rnd();const joined=r<.08?2020:r<.62?2021:pick([2021,2022,2022,2023,2024,2025,2026,2026]);
  const o={name:name||mkName(),joined,firstVc:Math.min(2026,joined+(rnd()<.65?0:Math.floor(rnd()*3))),seats:[]};owners.push(o);return o}
const whales=[newOwner("bigCarterVault"),newOwner("vinsanity_hq"),newOwner("halfmanhalfamazing"),newOwner("smith")];
whales[3].joined=2021;whales[3].firstVc=2021;
whales.forEach(w=>w.joined=2020);whales[3].joined=2021;
const pool=whales.slice(0,3);

// moments per set
const seats=[]; // filled later with positions
for(const S of SETS){
  const list=[];
  const serials=[...Array(S.minted)].map((_,i)=>i+1);
  // choose burned serials
  for(let i=serials.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[serials[i],serials[j]]=[serials[j],serials[i]]}
  const burnedSet=new Set(serials.slice(0,S.burned));
  const packs=S.key==="archive"?4:S.key==="tsd"?2:0;
  const packSet=new Set(serials.slice(S.burned,S.burned+packs));
  for(let serial=1;serial<=S.minted;serial++){
    let o;
    if(S.key==="archive"&&serial%31===0)o=whales[0];
    else if(S.key==="archive"&&serial%47===0)o=whales[1];
    else if((S.key==="rib"&&serial%60===0)||(S.key==="tsd"&&serial%90===0))o=whales[2];
    else if(rnd()<.42&&pool.length>40)o=pool[Math.floor(Math.pow(rnd(),2.2)*pool.length)];
    else{o=newOwner();pool.push(o)}
    const locked=rnd()<.38,listed=!burnedSet.has(serial)&&!packSet.has(serial)&&!locked&&rnd()<(S.tier==="court"?.12:.07);
    list.push({set:S.key,serial,owner:o,burned:burnedSet.has(serial),pack:packSet.has(serial),locked,
      price:listed&&FLOOR[S.key]?Math.round(FLOOR[S.key]*(1+Math.pow(rnd(),2.2)*2.5)*100)/100:0});
  }
  S.list=list;
}
// smith: 4 Archive + 1 RIB
{const a=SK.archive.list;[1234,2215,6001,8800].forEach(n=>{const m=a[n-1];m.owner=whales[3];m.burned=false;m.pack=false});
 const r=SK.rib.list[14];r.owner=whales[3];r.burned=false;}
// seats follow serial order: seat never moves, so you can buy the one next to a friend
for(const S of SETS)S.list.sort((a,b)=>a.serial-b.serial);

// ---------- geometry ----------
const CW=470,CH=250,SEAT=7.6,PITCH=10,ROWP=10.5;
function rrPath(W,H,R){
  // rounded rect perimeter, starting top-centre going clockwise
  const segs=[];const add=(len,fn)=>segs.push({len,fn});
  add(W-R,t=>[t*(W-R),-H]);
  add(Math.PI*R/2,t=>{const a=-Math.PI/2+t*Math.PI/2;return[W-R+R*Math.cos(a),-H+R+R*Math.sin(a)]});
  add(2*(H-R),t=>[W,-H+R+t*2*(H-R)]);
  add(Math.PI*R/2,t=>{const a=t*Math.PI/2;return[W-R+R*Math.cos(a),H-R+R*Math.sin(a)]});
  add(2*(W-R),t=>[W-R-t*2*(W-R),H]);
  add(Math.PI*R/2,t=>{const a=Math.PI/2+t*Math.PI/2;return[-W+R+R*Math.cos(a),H-R+R*Math.sin(a)]});
  add(2*(H-R),t=>[-W,H-R-t*2*(H-R)]);
  add(Math.PI*R/2,t=>{const a=Math.PI+t*Math.PI/2;return[-W+R+R*Math.cos(a),-H+R+R*Math.sin(a)]});
  add(W-R,t=>[-W+R+t*(W-R),-H]);
  const L=segs.reduce((a,s)=>a+s.len,0);
  return{L,at(u){let d=((u%1)+1)%1*L;for(const s of segs){if(d<=s.len)return s.fn(s.len?d/s.len:0);d-=s.len}return segs[0].fn(0)}};
}
const sections=[];
function buildRing(tier,startNum,nSec,inner,moments){
  const per=Math.ceil(moments.length/nSec);
  // rows needed: grow until the smallest (first) row fits roughly per/rows
  let rows=1;
  const secCap=r=>{let c=0;for(let k=0;k<r;k++){const d=inner+k*ROWP;const p=rrPath(CW+d,CH+d,70+d);c+=Math.floor(p.L/nSec*0.9/PITCH)}return c};
  while(secCap(rows)<per)rows++;
  let mi=0;
  for(let s=0;s<nSec;s++){
    const sec={num:startNum+s,tier,rows:[]};
    const u0=s/nSec,u1=(s+1)/nSec;let placed=0;
    for(let r=0;r<rows&&placed<per&&mi<moments.length;r++){
      const d=inner+r*ROWP;const p=rrPath(CW+d,CH+d,70+d);
      const arc=(u1-u0)*p.L*0.9,n=Math.floor(arc/PITCH);
      const ua=u0+(u1-u0)*0.05;
      for(let k=0;k<n&&placed<per&&mi<moments.length;k++){
        const [x,y]=p.at(ua+(k+.5)*PITCH/p.L);
        const m=moments[mi++];m.x=x;m.y=y;m.sec=sec.num;m.row=r+1;m.seat=k+1;seats.push(m);placed++;
      }
    }
    const dm=inner+rows*ROWP/2;const pm=rrPath(CW+dm,CH+dm,70+dm);
    const [lx,ly]=pm.at((u0+u1)/2);sec.lx=lx;sec.ly=ly;sections.push(sec);
  }
  return inner+rows*ROWP;
}
// courtside: 2 rows along each sideline
{
  const cs=SETS.filter(s=>s.tier==="court").flatMap(s=>s.list);
  const perRow=Math.ceil(cs.length/4);let i=0;
  const sides=[{y:-CH-22,dir:-1,sec:"N"},{y:-CH-32,dir:-1,sec:"N"},{y:CH+22,dir:1,sec:"S"},{y:CH+32,dir:1,sec:"S"}];
  sides.forEach((sd,ri)=>{
    const sp=(CW*1.7)/perRow;
    for(let k=0;k<perRow&&i<cs.length;k++){const m=cs[i++];m.x=-CW*.85+(k+.5)*sp;m.y=sd.y;m.sec=sd.sec==="N"?"Courtside North":"Courtside South";m.row=ri%2?"B":"A";m.seat=k+1;seats.push(m)}
  });
}
let r100=buildRing("100",101,24,70,[...SK.origin.list,...SK.tsd.list]);
let r200=buildRing("200",201,24,r100+26,[...SK.rib.list,...SK.fandom.list]);
let r300=buildRing("300",301,24,r200+30,SK.archive.list);
// mark Debut Club sections (mostly Series 1 TSD seats)
{const c=new Map();for(const s of seats){if(!c.has(s.sec))c.set(s.sec,[0,0]);const v=c.get(s.sec);v[0]++;if(s.set==="tsd")v[1]++}
 for(const sec of sections){const v=c.get(sec.num);sec.debut=v&&v[1]/v[0]>.5}}
const OUT=r300;
const WORLD={x0:-(CW+OUT)-40,x1:CW+OUT+40,y0:-(CH+OUT)-190,y1:CH+OUT+40};

// spatial hash for clicks
const GRID=30,hash=new Map();
for(const s of seats){const k=Math.floor(s.x/GRID)+","+Math.floor(s.y/GRID);if(!hash.has(k))hash.set(k,[]);hash.get(k).push(s)}
for(const s of seats)s.owner.seats.push(s);

// rafters (top burners / holders in sample data)
const topHolder=[...owners].sort((a,b)=>b.seats.length-a.seats.length)[0];
const BANNERS=[
 {t:"CARTER",n:"15",c:"#ce1141",sub:"RETIRED"},
 {t:"TOP HOLDER",n:String(topHolder.seats.length),c:"#3a2f6b",sub:topHolder.name},
 {t:"BURNED",n:"377",c:"#7a2410",sub:"ALL-TIME"},
 {t:"COLLECTORS",n:"9,730",c:"#14504a",sub:"AND COUNTING"},
 {t:"MINTED",n:"15,695",c:"#2c3550",sub:"SEATS"},
];

// ---------- canvas ----------
const cv=document.getElementById("arena"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,cam={x:0,y:0,s:.3},filter="all",selOwner=null,selSeat=null,anim=null,dirty=true,nearSeat=null;const NEAR=55;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;dirty=true}
function fitView(){const top=W<700?90:100,bot=70;const s=Math.min((W-24)/(WORLD.x1-WORLD.x0),(H-top-bot)/(WORLD.y1-WORLD.y0));
  return{x:(WORLD.x0+WORLD.x1)/2,y:(WORLD.y0+WORLD.y1)/2-(top-bot)/2/s,s}}
const toWorld=(sx,sy)=>({x:(sx-W/2)/cam.s+cam.x,y:(sy-H/2)/cam.s+cam.y});
const clampS=s=>Math.max(fitView().s*.6,Math.min(14,s));
function matches(m){switch(filter){
 case"sale":return m.price>0&&(!nearSeat||Math.hypot(m.x-nearSeat.x,m.y-nearSeat.y)<NEAR);
 case"court":return SK[m.set].tier==="court";case"debut":return !!SK[m.set].debut;case"burn":return m.burned;case"lock":return m.locked&&!m.burned;
