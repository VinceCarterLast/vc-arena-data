  let L=LST.filter(x=>SETS[x.set]&&(!window._lset||x.set===window._lset)&&(tier==="all"||TIER[x.set]===tier)).map(x=>({...x,a:"list",t:x.listed_at||"",v:VAL[`${x.set}:${x.serial}`]||VAL[x.set]||AVG[x.set]}));
  L.sort(sort==="low"?(a,b)=>a.price-b.price:sort==="high"?(a,b)=>b.price-a.price:sort==="new"?(a,b)=>String(b.t).localeCompare(String(a.t)):(a,b)=>a.price/(a.v||1e9)-b.price/(b.v||1e9));
  const bar=window._lset?`<div class="chips" style="margin:2px 0 8px"><button data-s="clear">✕ Showing ${esc(SETS[window._lset][0])} only</button></div>`:"";
  const list=L.slice(0,shown).map(e=>{const[S]=SETS[e.set],i=EVI.push(e)-1,c="var(--blue)";
    if(view==="cards")return `<div class="card" style="--c:${c}" data-i="${i}"><img loading="lazy" src="${img(e)}" alt=""><div><span class="type">🏷️ FOR SALE</span><div class="nm">${esc(S)} <span>#${e.serial}</span></div><div class="who">listed by ${esc(disp(e.seller))||"?"}</div>${deal(e)}</div>
      <div class="rt"><div class="price">${money(e.price)}</div>${e.v?`<div class="val">Value ${money(e.v)}</div>`:""}<div class="ago">${e.t?ago(e.t):""}</div></div></div>`;
    return `<div class="row" style="--c:${c}" data-i="${i}"><img loading="lazy" src="${img(e)}" alt=""><div><div class="t">🏷️ <b>${esc(S)} #${e.serial}</b> ${deal(e)}</div><div class="s">by ${esc(disp(e.seller))||"?"}${e.v?` · value ${money(e.v)}`:""}</div></div><div class="r"><b>${money(e.price)}</b><i>${e.t?ago(e.t):""}</i></div></div>`}).join("");
  f.className="";f.innerHTML=box+bar+`<div class="${view}" style="display:flex;flex-direction:column;gap:${view==="list"?0:8}px">${list||'<div class="empty">No listings right now.</div>'}</div>`;
  if(view==="list")f.lastElementChild.style.cssText+="background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden";
  f.querySelectorAll("[data-s]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();window._lset=null;shown=60;render()});
  f.querySelectorAll("tr[data-set]").forEach(r=>r.onclick=ev=>{ev.stopPropagation();window._lset=r.dataset.set;shown=60;render()});
  m.hidden=L.length<=shown;m.textContent=`Show more (${(L.length-shown).toLocaleString()} more listings)`}
function offersBox(){if(!OFF||!OFF.top)return `<div class="box2"><h3>🤝 Best open offers</h3><p>Offer tracking starts with the latest bot update. Best offers per edition will show here.</p></div>`;
  const rows=Object.keys(SETS).filter(k=>OFF.top[k]).map(k=>{const o=OFF.top[k],L=LST.filter(x=>x.set===k),low=L.length?Math.min(...L.map(x=>x.price)):null,net=o.p*.95;
    return `<tr><td><b>${esc(SETS[k][0])}</b></td><td><b>${money(o.p)}</b></td><td>${o.n}</td><td>${low?money(low):"–"}</td><td>${low&&net>low?`<span class="sig need">🔁 +${money(net-low)} flip</span>`:`<span class="sig ok">–</span>`}</td></tr>`}).join("");
  return `<div class="box2"><h3>🤝 Best open offers by edition</h3><p>Generous offers (at or above the lowest ask, or well above true value) also appear below. "Flip" = accept the offer (after Top Shot's 5% fee) and rebuy at the lowest ask.</p>
    <div class="edwrap"><table class="ed"><tr><th>Edition</th><th>Best offer</th><th>Open offers</th><th>Lowest ask</th><th>Flip</th></tr>${rows||'<tr><td colspan="5">No open offers tracked yet.</td></tr>'}</table></div></div>`}
function packsBox(){const types=Object.entries(PACKS).map(([pd,p])=>({pd,...p,vc:PKCOUNT[pd]||0})).filter(p=>p.vc).sort((a,b)=>b.vc-a.vc);
  if(!types.length){const per=Object.entries(SEALED).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);if(!per.length)return "";const tot=per.reduce((a,x)=>a+x[1],0);
    return `<div class="box2"><h3>📦 ${tot.toLocaleString()} VC moments still sealed in packs</h3><p>Unopened packs that still hold a Vince Carter moment, by set. Tap a set to see its sealed seats in the arena.</p>
    <div class="edwrap"><table class="ed"><tr><th>Set</th><th>Still sealed</th></tr>${per.map(([k,n])=>`<tr class="ck" onclick="location.href='arena.html?zoom=${k}'"><td><b>${esc(SETS[k][0])}</b></td><td>${n}</td></tr>`).join("")}</table></div></div>`}
  return `<div class="box2"><h3>📦 Sealed packs that still hold a VC moment</h3><p>These pack types still have unopened Vince Carter moments inside. Tap one to see packs for sale on Top Shot.</p>
    <div class="edwrap"><table class="ed"><tr><th>Pack</th><th>VC inside</th><th>Packs listed</th><th>Lowest pack</th></tr>${types.map(p=>`<tr class="ck" data-pd="${esc(p.pd)}"><td><b>${esc(p.t||p.pd)}</b></td><td>${p.vc}</td><td>${p.n||0}</td><td>${p.low?money(p.low/100):"–"}</td></tr>`).join("")}</table></div></div>`}
document.getElementById("feed").addEventListener("click",ev=>{const r=ev.target.closest("tr[data-pd]");if(r){ev.stopPropagation();window.open("https://nbatopshot.com/search/packs?status=all&packSource=marketplace&packDetail="+encodeURIComponent(r.dataset.pd),"_blank","noopener")}},true);
let EVI=[],SEALED={};const _r=render;render=function(){EVI=[];_r()};
document.getElementById("more").onclick=()=>{shown+=100;render()};
document.getElementById("feed").addEventListener("click",ev=>{const d=ev.target.closest("[data-d]");const el=ev.target.closest("[data-i]");if(!el)return;const e=EVI[+el.dataset.i];
  if(d){ev.stopPropagation();return details(e)}const u=tsLink(e);if((e.a==="list"||e.a==="offer")&&u)window.open(u,"_blank","noopener");else details(e)});
document.querySelectorAll(".strip a[data-f]").forEach(a=>a.addEventListener("click",()=>{flt=a.dataset.f;render()}));
function details(e){const[S,sub,tot]=SETS[e.set],[T,c,ic]=TYPE[e.a]||["","",""],v=valOf(e),d=document.getElementById("det"),u=tsLink(e);
  const rows=[["Event",`${ic} ${T}`],e.price?["Price",money(e.price)]:null,v?["True value",`${money(v)} <small>(NothingButStats.com)</small>`]:null,e.seller?[e.a==="gift"?"From":e.a==="sale"||e.a==="list"?"Seller":"By",esc(disp(e.seller))]:null,
    e.buyer?[e.a==="gift"?"To":e.a==="pack"?"Pulled by":"Buyer",esc(disp(e.buyer))]:null,["Edition",e.serial?`${esc(sub)} · #${e.serial} / ${tot.toLocaleString()}`:`${esc(sub)} · edition offer (any serial)`],["When",new Date(e.t).toLocaleString("en-US",{timeZone:"America/Toronto",month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})+" ET"]].filter(Boolean);
  d.innerHTML=`<div class="box"><div class="pic"><img src="${img(e)}" alt=""></div><div class="in"><h2>${esc(S)} ${e.serial?"#"+e.serial:"· any serial"}</h2>${deal(e)}
    <div class="kv">${rows.map(([k,x])=>`<span>${k}</span><b>${x}</b>`).join("")}</div>
    <div class="btns">${u?`<a class="go" href="${u}" target="_blank" rel="noopener">See moment on Top Shot</a>`:""}${e.serial?`<a href="arena.html?seat=${e.set}:${e.serial}">${e.a==="burn"?"📜 Retirement record":"📜 Moment history"}</a>`:""}<button data-x>Close</button></div></div></div>`;
  d.hidden=false;d.querySelector("[data-x]").onclick=()=>d.hidden=true}
document.getElementById("det").onclick=e=>{if(e.target.id==="det")e.target.hidden=true};
const get=f=>fetch(RAW+f+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
// older history (completed sales, retirements, gifts) from the arena's data file
async function loadHistory(){const d=await get("arena_owners.json");if(!d||!d.sets)return;const nm=i=>i>=0&&d.names&&d.names[i]!=null?d.names[i]:"",iso=day=>new Date(DAY0+day*DAY+12*36e5).toISOString(),out=[];
  for(const[k,R]of Object.entries(d.sets)){if(!SETS[k])continue;
    for(const[sn,arr]of Object.entries(R.sh||{}))for(const h of arr)if(h[2]!==-1)out.push({t:iso(h[1]),a:"sale",set:k,serial:+sn,price:h[0]/100,seller:nm(h[2]),buyer:nm(h[3]),d:1});
    (R.bt||[]).forEach((day,i)=>{if(day&&R.f&&(R.f[i]&2))out.push({t:iso(day),a:"burn",set:k,serial:i+1,seller:nm(R.o?R.o[i]:-1),d:1})});
    for(const[sn,arr]of Object.entries(R.gh||{}))for(const g of arr)out.push({t:iso(g[0]),a:"gift",set:k,serial:+sn,seller:g[1],buyer:g[2],d:1});
    for(const pd of Object.values(R.pkd||{}))PKCOUNT[pd]=(PKCOUNT[pd]||0)+1;
    SEALED[k]=(R.f||[]).filter(x=>x&4).length}
  PACKS=d.packs||{};
  HIST=out;render()}
async function load(){
  const[a,s,l,n,o]=await Promise.all([get("activity.json"),get("supply.json"),get("listings.json"),VAL.loaded?null:get("nbs_values.json"),get("offers.json")]);
  if(o)OFF=o;if(!IDS)IDS=await fetch("tokens.json").then(r=>r.json()).catch(()=>null);
  if(n){for(const[k,x]of Object.entries(n.sets||{}))if(x&&x.v&&x.v.c)VAL[k]=x.v.c/100;for(const[k,x]of Object.entries(n.serials||{}))if(x&&x.v&&x.v.c)VAL[k]=x.v.c/100;VAL.loaded=1}
  if(a&&a.events){LIVE=a.events.slice();document.getElementById("upd").textContent="Updated "+ago(a.updated||(LIVE[0]&&LIVE[0].t))}
  if(s&&s.existing)document.getElementById("sLeft").textContent=s.existing.toLocaleString();
  if(l&&l.listings){const L=Object.values(l.listings);LST=L.filter(x=>x.price);TOK={};for(const x of L)if(x.token)TOK[`${x.set}:${x.serial}`]=x.token;
    const p=L.map(x=>x.price).filter(Boolean);if(p.length){document.getElementById("sLow").textContent=money(Math.min(...p));document.getElementById("sLowL").textContent=`Lowest ask · ${p.length} listed`}}
  render()}
load().then(loadHistory);setInterval(load,60000);
</script>
